<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 700; fill: #58a6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .flyback-loop { stroke: #d29922; stroke-width: 3; fill: none; stroke-dasharray: 6 4; animation: loop-flow 1s linear infinite; }
      @keyframes loop-flow { to { stroke-dashoffset: -20; } }
      .shock { fill: #f85149; filter: drop-shadow(0 0 8px #ff7b72); animation: shock-pulse 0.8s infinite alternate; }
      @keyframes shock-pulse { from { opacity: 0.4; } to { opacity: 1; } }
    </style>
  </defs>

  <rect x="15" y="15" width="820" height="320" class="bg" />
  <text x="35" y="45" class="header">🛡️ DIODES &amp; FLYBACK PROTECTION (STOPPING THE INDUCTIVE KICK)</text>
  <text x="35" y="65" class="sub">Collapsing magnetic fields in coils throw a 100V reverse punch — the diode absorbs it!</text>

  <!-- Left: The Diode One-Way Check Valve -->
  <g transform="translate(35, 85)">
    <rect x="0" y="0" width="365" height="215" class="card"/>
    <text x="20" y="25" class="title" fill="#58a6ff">What a Diode Is: A One-Way Valve</text>

    <!-- Forward Bias (Flows) -->
    <g transform="translate(20, 45)">
      <line x1="20" y1="30" x2="60" y2="30" stroke="#3fb950" stroke-width="3"/>
      <!-- Diode Symbol -->
      <polygon points="85,30 60,15 60,45" fill="#3fb950"/>
      <line x1="85" y1="15" x2="85" y2="45" stroke="#3fb950" stroke-width="3.5"/>
      <line x1="85" y1="30" x2="125" y2="30" stroke="#3fb950" stroke-width="3"/>
      <text x="140" y="25" class="mono" fill="#3fb950">Forward Bias</text>
      <text x="140" y="42" class="sub">Current FLOWS freely ✅</text>
    </g>

    <!-- Reverse Bias (Blocked) -->
    <g transform="translate(20, 115)">
      <line x1="20" y1="30" x2="60" y2="30" stroke="#f85149" stroke-width="2.5" stroke-dasharray="3 3"/>
      <!-- Diode Symbol (Blocked) -->
      <polygon points="60,30 85,15 85,45" fill="#21262d" stroke="#f85149" stroke-width="2"/>
      <line x1="60" y1="15" x2="60" y2="45" stroke="#f85149" stroke-width="3.5"/>
      <line x1="85" y1="30" x2="125" y2="30" stroke="#f85149" stroke-width="2.5" stroke-dasharray="3 3"/>
      <text x="140" y="25" class="mono" fill="#f85149">Reverse Bias</text>
      <text x="140" y="42" class="sub">Current BLOCKED completely ❌</text>
    </g>

    <text x="20" y="195" class="sub">Anode (+) → Cathode (−) with silver stripe marking cathode</text>
  </g>

  <!-- Right: Flyback Diode Across Inductive Coil -->
  <g transform="translate(425, 85)">
    <rect x="0" y="0" width="385" height="215" class="card" stroke="#3fb950" stroke-width="1.2"/>
    <text x="20" y="25" class="title" fill="#3fb950">Flyback Protection Circuit (1N4007)</text>

    <!-- +12V Rail -->
    <circle cx="120" cy="50" r="6" fill="#f85149"/>
    <text x="135" y="55" class="mono" fill="#f85149">+12V Rail</text>

    <!-- Top Junction -->
    <line x1="120" y1="56" x2="120" y2="75" stroke="#e6edf3" stroke-width="2.5"/>
    <line x1="70" y1="75" x2="170" y2="75" stroke="#e6edf3" stroke-width="2.5"/>

    <!-- Left Branch: Flyback Diode (Wired in REVERSE) -->
    <line x1="70" y1="75" x2="70" y2="100" stroke="#d29922" stroke-width="2.5"/>
    <polygon points="70,105 55,125 85,125" fill="#d29922"/>
    <line x1="55" y1="105" x2="85" y2="105" stroke="#d29922" stroke-width="3"/>
    <line x1="70" y1="125" x2="70" y2="155" stroke="#d29922" stroke-width="2.5"/>
    <text x="15" y="125" class="mono" fill="#d29922" font-size="10px">1N4007</text>

    <!-- Right Branch: Inductive Coil (Relay / Motor) -->
    <rect x="145" y="95" width="50" height="40" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <text x="150" y="120" font-size="16">🌀</text>
    <line x1="170" y1="75" x2="170" y2="95" stroke="#58a6ff" stroke-width="2.5"/>
    <line x1="170" y1="135" x2="170" y2="155" stroke="#58a6ff" stroke-width="2.5"/>
    <text x="205" y="112" class="title" fill="#58a6ff">Relay / Motor</text>
    <text x="205" y="128" class="sub">Coil creates magnetic field</text>

    <!-- Bottom Junction -->
    <line x1="70" y1="155" x2="170" y2="155" stroke="#e6edf3" stroke-width="2.5"/>
    
    <!-- Animated Dissipation Loop -->
    <rect x="60" y="70" width="120" height="90" rx="6" class="flyback-loop"/>

    <!-- Switch / MOSFET to GND -->
    <line x1="120" y1="155" x2="120" y2="180" stroke="#e6edf3" stroke-width="2.5"/>
    <rect x="100" y="180" width="40" height="20" rx="3" fill="#21262d" stroke="#3fb950"/>
    <text x="106" y="195" class="mono" font-size="10px" fill="#3fb950">MOSFET</text>

    <text x="155" y="180" class="sub" fill="#3fb950">Safe: 100V kick safely</text>
    <text x="155" y="195" class="sub" fill="#3fb950">loops into heat in the diode!</text>
  </g>
</svg>

