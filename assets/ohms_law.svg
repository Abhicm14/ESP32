<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #58a6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #e6edf3; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: bold; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #8b949e; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .v-glow { fill: #58a6ff; filter: drop-shadow(0 0 8px #1f6feb); animation: pulse-v 2.5s infinite; }
      .i-glow { fill: #3fb950; filter: drop-shadow(0 0 8px #238636); animation: pulse-i 2.5s infinite; }
      .r-glow { fill: #d29922; filter: drop-shadow(0 0 8px #9e6a03); animation: pulse-r 2.5s infinite; }
      @keyframes pulse-v {
        0%, 100% { opacity: 0.6; }
        33% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes pulse-i {
        0%, 100% { opacity: 0.6; }
        66% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes pulse-r {
        0%, 100% { opacity: 1; transform: scale(1.05); }
        50% { opacity: 0.6; }
      }
    </style>
  </defs>

  <rect x="15" y="15" width="820" height="310" class="bg" />
  <text x="35" y="45" class="header">📐 Ohm's Law Magic Triangle: V = I × R</text>
  <text x="35" y="68" class="sub">Cover the letter you want with your finger to instantly reveal the formula!</text>

  <!-- Left: The Master Triangle -->
  <g transform="translate(60, 90)">
    <!-- Main Triangle Body -->
    <polygon points="140,20 20,200 260,200" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    
    <!-- Dividing Lines -->
    <line x1="60" y1="130" x2="220" y2="130" stroke="#58a6ff" stroke-width="2.5"/>
    <line x1="140" y1="130" x2="140" y2="200" stroke="#58a6ff" stroke-width="2.5"/>

    <!-- V Letter -->
    <text x="130" y="95" class="mono v-glow" font-size="34">V</text>
    <text x="95" y="115" class="sub" font-size="10px">VOLTAGE (Volts)</text>

    <!-- I Letter -->
    <text x="75" y="175" class="mono i-glow" font-size="30">I</text>
    <text x="50" y="195" class="sub" font-size="10px">CURRENT (Amps)</text>

    <!-- × Symbol -->
    <text x="133" y="172" class="mono" fill="#8b949e" font-size="22">×</text>

    <!-- R Letter -->
    <text x="180" y="175" class="mono r-glow" font-size="30">R</text>
    <text x="160" y="195" class="sub" font-size="10px">RESISTANCE (Ω)</text>
  </g>

  <!-- Right: 3 Interactive Formula Cards -->
  <!-- Card 1: Find V -->
  <rect x="360" y="85" width="450" height="65" class="card" stroke="#58a6ff" stroke-width="1.5"/>
  <circle cx="390" cy="117" r="16" fill="#1f6feb" fill-opacity="0.3"/>
  <text x="384" y="123" class="mono" fill="#58a6ff">V</text>
  <text x="420" y="112" class="title" fill="#58a6ff">Cover V → You see I × R</text>
  <text x="420" y="132" class="mono" fill="#e6edf3" font-size="13px">Voltage = Current × Resistance</text>
  <text x="680" y="125" class="mono" fill="#58a6ff" font-size="13px">V = I × R</text>

  <!-- Card 2: Find I -->
  <rect x="360" y="160" width="450" height="65" class="card" stroke="#3fb950" stroke-width="1.5"/>
  <circle cx="390" cy="192" r="16" fill="#238636" fill-opacity="0.3"/>
  <text x="386" y="198" class="mono" fill="#3fb950">I</text>
  <text x="420" y="187" class="title" fill="#3fb950">Cover I → You see V ÷ R</text>
  <text x="420" y="207" class="mono" fill="#e6edf3" font-size="13px">Current = Voltage ÷ Resistance</text>
  <text x="680" y="200" class="mono" fill="#3fb950" font-size="13px">I = V / R</text>

  <!-- Card 3: Find R -->
  <rect x="360" y="235" width="450" height="65" class="card" stroke="#d29922" stroke-width="1.5"/>
  <circle cx="390" cy="267" r="16" fill="#9e6a03" fill-opacity="0.3"/>
  <text x="384" y="273" class="mono" fill="#d29922">R</text>
  <text x="420" y="262" class="title" fill="#d29922">Cover R → You see V ÷ I</text>
  <text x="420" y="282" class="mono" fill="#e6edf3" font-size="13px">Resistance = Voltage ÷ Current</text>
  <text x="680" y="275" class="mono" fill="#d29922" font-size="13px">R = V / I</text>
</svg>

