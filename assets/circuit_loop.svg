<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #58a6ff; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #e6edf3; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
      .wire { fill: none; stroke-width: 3.5; stroke-linecap: round; }
      .wire-closed { stroke: #3fb950; stroke-dasharray: 8 6; animation: flow 1.2s linear infinite; }
      .wire-open { stroke: #8b949e; stroke-dasharray: 6 6; }
      .wire-short { stroke: #f85149; stroke-dasharray: 4 4; animation: rush 0.4s linear infinite; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .bulb-on { fill: #d29922; filter: drop-shadow(0 0 8px #d29922); animation: glow 1.5s ease-in-out infinite alternate; }
      .bulb-off { fill: #21262d; stroke: #8b949e; stroke-width: 1.5; }
      .spark { fill: #f85149; filter: drop-shadow(0 0 6px #ff7b72); animation: blink 0.3s infinite alternate; }
      @keyframes flow {
        to { stroke-dashoffset: -28; }
      }
      @keyframes rush {
        to { stroke-dashoffset: -24; }
      }
      @keyframes glow {
        from { fill: #e3b341; filter: drop-shadow(0 0 6px #e3b341); }
        to { fill: #ffd33d; filter: drop-shadow(0 0 16px #ffd33d); }
      }
      @keyframes blink {
        from { opacity: 0.3; filter: drop-shadow(0 0 4px #ff7b72); }
        to { opacity: 1; filter: drop-shadow(0 0 14px #f85149); }
      }
    </style>
  </defs>

  <!-- Panel 1: Complete Circuit -->
  <rect x="15" y="15" width="255" height="290" class="bg" />
  <text x="30" y="42" class="title">✅ Complete Closed Loop</text>
  <text x="30" y="60" class="sub">Electrons flow • Bulb turns ON</text>
  
  <!-- Circuit 1 Wire Loop -->
  <rect x="40" y="85" width="205" height="150" rx="10" fill="none" stroke="#238636" stroke-width="3" opacity="0.4"/>
  <rect x="40" y="85" width="205" height="150" rx="10" class="wire wire-closed"/>
  
  <!-- Battery Component -->
  <rect x="25" y="135" width="30" height="50" class="box" stroke="#3fb950"/>
  <text x="33" y="155" class="label" font-weight="bold" fill="#3fb950">+</text>
  <text x="35" y="175" class="label" font-weight="bold" fill="#8b949e">−</text>
  <text x="30" y="202" class="sub" font-size="9px">3.3V</text>

  <!-- Light Bulb Component -->
  <circle cx="245" cy="160" r="18" class="bulb-on"/>
  <text x="238" y="165" font-size="14">💡</text>
  <text x="215" y="195" class="label">Load (Bulb)</text>
  <text x="50" y="270" class="label" fill="#3fb950">Normal safe current flows</text>

  <!-- Panel 2: Open Circuit -->
  <rect x="295" y="15" width="255" height="290" class="bg" />
  <text x="310" y="42" class="title" fill="#8b949e">❌ Broken Open Circuit</text>
  <text x="310" y="60" class="sub">Wire has a gap • Zero flow</text>

  <!-- Circuit 2 Wire Loop with Gap -->
  <path d="M 320 160 L 320 95 Q 320 85 330 85 L 515 85 Q 525 85 525 95 L 525 160" fill="none" class="wire wire-open" />
  <path d="M 525 160 L 525 225 Q 525 235 515 235 L 435 235" fill="none" class="wire wire-open" />
  <path d="M 390 235 L 330 235 Q 320 235 320 225 L 320 160" fill="none" class="wire wire-open" />
  
  <!-- Switch Gap -->
  <circle cx="390" cy="235" r="4" fill="#f85149"/>
  <circle cx="435" cy="235" r="4" fill="#f85149"/>
  <line x1="390" y1="235" x2="425" y2="215" stroke="#f85149" stroke-width="2.5" stroke-linecap="round"/>
  <text x="400" y="260" class="sub" fill="#f85149">Open Gap (Switch OFF)</text>

  <!-- Battery Component -->
  <rect x="305" y="135" width="30" height="50" class="box"/>
  <text x="313" y="155" class="label" font-weight="bold">+</text>
  <text x="315" y="175" class="label" font-weight="bold">−</text>

  <!-- Light Bulb Off -->
  <circle cx="525" cy="160" r="18" class="bulb-off"/>
  <text x="518" y="165" font-size="14" opacity="0.4">💡</text>
  <text x="345" y="285" class="sub">Current = 0 mA (No complete loop)</text>

  <!-- Panel 3: Short Circuit -->
  <rect x="575" y="15" width="255" height="290" class="bg" />
  <text x="590" y="42" class="title" fill="#f85149">⚠️ Dangerous Short Circuit</text>
  <text x="590" y="60" class="sub">Zero resistance • Sparks &amp; fire!</text>

  <!-- Short Loop directly across battery -->
  <rect x="600" y="85" width="130" height="150" rx="10" class="wire wire-short"/>
  
  <!-- Battery Component -->
  <rect x="585" y="135" width="30" height="50" class="box" stroke="#f85149"/>
  <text x="593" y="155" class="label" font-weight="bold" fill="#f85149">+</text>
  <text x="595" y="175" class="label" font-weight="bold" fill="#f85149">−</text>

  <!-- Danger Sparks -->
  <circle cx="665" cy="85" r="12" class="spark" fill-opacity="0.8"/>
  <text x="656" y="90" font-size="16">💥</text>
  <circle cx="665" cy="235" r="12" class="spark" fill-opacity="0.8"/>
  <text x="656" y="240" font-size="16">🔥</text>

  <rect x="740" y="125" width="80" height="70" class="box" stroke="#f85149" stroke-dasharray="3 3"/>
  <text x="748" y="148" class="label" fill="#f85149" font-weight="bold">NO LOAD!</text>
  <text x="746" y="166" class="sub" font-size="10px">R ≈ 0 Ohms</text>
  <text x="746" y="182" class="sub" font-size="10px">I = Extreme!</text>

  <text x="605" y="275" class="label" fill="#f85149">Board / Battery Destroys!</text>
</svg>

