<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 700; fill: #58a6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #e6edf3; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
      .wire { stroke: #3fb950; stroke-width: 3.5; fill: none; stroke-dasharray: 8 6; animation: flow 1.2s linear infinite; }
      .led-glow { fill: #f85149; filter: drop-shadow(0 0 14px #ff7b72); animation: led-pulse 1.5s ease-in-out infinite alternate; }
      .ray { stroke: #ffd33d; stroke-width: 2.5; stroke-linecap: round; animation: ray-anim 1.5s infinite alternate; }
      @keyframes flow {
        to { stroke-dashoffset: -28; }
      }
      @keyframes led-pulse {
        from { fill: #da3633; filter: drop-shadow(0 0 8px #f85149); }
        to { fill: #ff7b72; filter: drop-shadow(0 0 20px #ff7b72); }
      }
      @keyframes ray-anim {
        from { opacity: 0.3; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1.1); }
      }
    </style>
  </defs>

  <rect x="15" y="15" width="820" height="310" class="bg" />
  <text x="35" y="45" class="header">💡 LED &amp; Current-Limiting Resistor Circuit</text>
  <text x="35" y="65" class="sub">How to protect your ESP32 GPIO pin and prevent the LED from burning up</text>

  <!-- Animated Circuit Path -->
  <line x1="60" y1="165" x2="220" y2="165" class="wire"/>
  <line x1="310" y1="165" x2="440" y2="165" class="wire"/>
  <line x1="530" y1="165" x2="680" y2="165" class="wire"/>

  <!-- ESP32 GPIO Source -->
  <g transform="translate(60, 165)">
    <circle cx="0" cy="0" r="10" fill="#1f6feb"/>
    <text x="-40" y="-20" class="title" fill="#58a6ff">ESP32 GPIO Pin</text>
    <text x="-30" y="-4" class="mono" fill="#58a6ff" font-weight="bold">3.3 V</text>
  </g>

  <!-- Resistor Component -->
  <g transform="translate(220, 140)">
    <rect x="0" y="0" width="90" height="50" rx="6" fill="#21262d" stroke="#d29922" stroke-width="2.5"/>
    <line x1="25" y1="0" x2="25" y2="50" stroke="#f0883e" stroke-width="5"/>
    <line x1="45" y1="0" x2="45" y2="50" stroke="#f0883e" stroke-width="5"/>
    <line x1="65" y1="0" x2="65" y2="50" stroke="#79c0ff" stroke-width="5"/>
    <text x="12" y="-12" class="title" fill="#d29922">Resistor: 220 Ω</text>
    <text x="12" y="70" class="sub">Drops: 3.3V − 2.0V = 1.3 V</text>
  </g>

  <!-- LED Component -->
  <g transform="translate(440, 125)">
    <!-- LED Triangle Body -->
    <polygon points="40,40 10,15 10,65" class="led-glow"/>
    <line x1="40" y1="15" x2="40" y2="65" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Light Rays -->
    <line x1="30" y1="10" x2="45" y2="-5" class="ray"/>
    <line x1="42" y1="18" x2="57" y2="3" class="ray"/>

    <text x="-15" y="-15" class="title" fill="#f85149">Red LED</text>
    <text x="-15" y="85" class="sub">Takes Toll: Vf = 2.0 V</text>
    <text x="-10" y="100" class="sub" font-size="10px">Anode (+) → Cathode (−)</text>
  </g>

  <!-- Ground Return (0V) -->
  <g transform="translate(680, 165)">
    <circle cx="0" cy="0" r="8" fill="#8b949e"/>
    <line x1="0" y1="0" x2="0" y2="30" stroke="#8b949e" stroke-width="2.5"/>
    <line x1="-15" y1="30" x2="15" y2="30" stroke="#8b949e" stroke-width="3"/>
    <line x1="-10" y1="36" x2="10" y2="36" stroke="#8b949e" stroke-width="2.5"/>
    <line x1="-5" y1="42" x2="5" y2="42" stroke="#8b949e" stroke-width="2"/>
    <text x="-25" y="60" class="sub" font-weight="bold">GND (0V)</text>
  </g>

  <!-- Math & Current Verification Box -->
  <g transform="translate(60, 245)">
    <rect x="0" y="0" width="720" height="55" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="25" y="24" class="mono" fill="#3fb950">Current (I) = (3.3V − 2.0V) ÷ 220 Ω = 1.3V ÷ 220 Ω = 5.9 mA</text>
    <text x="25" y="44" class="sub">Safe for ESP32 pin (limit is 20 mA) • LED glows brightly without heating up!</text>
  </g>
</svg>

