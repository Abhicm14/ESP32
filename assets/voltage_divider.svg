<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 700; fill: #58a6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .flow { stroke: #58a6ff; stroke-width: 3; fill: none; stroke-dasharray: 6 4; animation: flow 1.5s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
    </style>
  </defs>

  <rect x="15" y="15" width="820" height="290" class="bg" />
  <text x="35" y="45" class="header">⚖️ Voltage Divider: Scaling High Voltages Safely</text>
  <text x="35" y="65" class="sub">Two resistors in series scale 12V down so the ESP32 3.3V ADC can read it safely</text>

  <!-- Circuit Diagram -->
  <g transform="translate(60, 85)">
    <!-- 12V Input Point -->
    <circle cx="80" cy="20" r="7" fill="#f85149"/>
    <text x="100" y="25" class="mono" fill="#f85149" font-weight="bold">Vin = 12V Battery</text>

    <!-- Top Wire -->
    <line x1="80" y1="20" x2="80" y2="50" class="flow"/>

    <!-- Resistor R1 -->
    <rect x="65" y="50" width="30" height="45" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <text x="105" y="70" class="title">R1 = 10 kΩ</text>
    <text x="105" y="86" class="sub">Drops 9.03 V</text>

    <!-- Midpoint Wire -->
    <line x1="80" y1="95" x2="80" y2="120" class="flow"/>
    <circle cx="80" cy="120" r="5" fill="#3fb950"/>

    <!-- Tap to ESP32 ADC Pin -->
    <line x1="80" y1="120" x2="240" y2="120" stroke="#3fb950" stroke-width="3" stroke-dasharray="4 3"/>
    <polygon points="245,120 235,115 235,125" fill="#3fb950"/>
    <rect x="250" y="98" width="130" height="44" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="260" y="117" class="mono" fill="#3fb950" font-weight="bold">Vout = 2.97 V</text>
    <text x="260" y="133" class="sub">To ESP32 ADC Pin</text>

    <!-- Resistor R2 -->
    <line x1="80" y1="120" x2="80" y2="145" class="flow"/>
    <rect x="65" y="145" width="30" height="45" rx="4" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <text x="105" y="165" class="title">R2 = 3.3 kΩ</text>
    <text x="105" y="181" class="sub">Drops 2.97 V to GND</text>

    <!-- Bottom to Ground -->
    <line x1="80" y1="190" x2="80" y2="210" class="flow"/>
    <line x1="65" y1="210" x2="95" y2="210" stroke="#8b949e" stroke-width="2"/>
    <line x1="70" y1="215" x2="90" y2="215" stroke="#8b949e" stroke-width="2"/>
    <line x1="75" y1="220" x2="85" y2="220" stroke="#8b949e" stroke-width="2"/>
    <text x="105" y="215" class="sub">GND (0V)</text>
  </g>

  <!-- Right Math Box -->
  <g transform="translate(480, 95)">
    <rect x="0" y="0" width="335" height="180" class="card" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="20" y="30" class="title" fill="#58a6ff">The Voltage Divider Formula</text>
    <text x="20" y="60" class="mono" fill="#3fb950">Vout = Vin × [ R2 / (R1 + R2) ]</text>
    
    <text x="20" y="90" class="mono" fill="#e6edf3" font-size="11px">Vout = 12V × [ 3.3k / (10k + 3.3k) ]</text>
    <text x="20" y="110" class="mono" fill="#e6edf3" font-size="11px">Vout = 12V × ( 3300 / 13300 )</text>
    <text x="20" y="130" class="mono" fill="#3fb950" font-weight="bold">Vout = 12V × 0.248 = 2.97 V ✅</text>
    
    <text x="20" y="160" class="sub">Safe because 2.97 V ≤ 3.3 V max ESP32 ADC limit!</text>
  </g>
</svg>

