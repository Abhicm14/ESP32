<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 700; fill: #58a6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .wire-danger { stroke: #f85149; stroke-width: 3; fill: none; stroke-dasharray: 6 4; animation: rush 0.6s linear infinite; }
      .wire-safe { stroke: #3fb950; stroke-width: 3; fill: none; stroke-dasharray: 6 4; animation: rush 1.2s linear infinite; }
      @keyframes rush { to { stroke-dashoffset: -20; } }
      .spark { fill: #f85149; filter: drop-shadow(0 0 8px #ff7b72); animation: flash 0.4s infinite alternate; }
      @keyframes flash { from { opacity: 0.3; } to { opacity: 1; } }
    </style>
  </defs>

  <rect x="15" y="15" width="820" height="300" class="bg" />
  <text x="35" y="45" class="header">⚡ LOGIC LEVELS: 3.3V vs 5V (PROTECTING YOUR ESP32)</text>
  <text x="35" y="65" class="sub">The ESP32 is a 3.3V chip. Its internal silicon gates are destroyed by 5V unless adapted!</text>

  <!-- Left: The Fatal 5V Direct Connection -->
  <g transform="translate(35, 85)">
    <rect x="0" y="0" width="375" height="210" class="card" stroke="#f85149" stroke-width="1.2"/>
    <text x="20" y="25" class="title" fill="#f85149">💥 DIRECT 5V WIRE = DEAD PIN</text>
    <text x="20" y="42" class="sub">No protection • Over-voltage punctures silicon!</text>

    <!-- 5V Sensor -->
    <rect x="25" y="70" width="80" height="50" rx="6" fill="#21262d" stroke="#f85149"/>
    <text x="35" y="93" class="mono" fill="#f85149">5V Sensor</text>
    <text x="42" y="108" class="sub">Output</text>

    <!-- Danger Wire -->
    <line x1="105" y1="95" x2="250" y2="95" class="wire-danger"/>
    <circle cx="175" cy="95" r="10" class="spark" fill-opacity="0.8"/>
    <text x="168" y="100" font-size="14">⚡</text>

    <!-- ESP32 GPIO -->
    <rect x="250" y="70" width="95" height="50" rx="6" fill="#21262d" stroke="#f85149"/>
    <text x="262" y="92" class="mono" fill="#f85149">ESP32</text>
    <text x="258" y="107" class="mono" font-size="10px" fill="#ff7b72">GPIO Pin</text>

    <rect x="20" y="145" width="335" height="50" rx="6" fill="#0d1117" stroke="#f85149"/>
    <text x="30" y="165" class="mono" fill="#f85149">💥 Gate Oxide Breakdown!</text>
    <text x="30" y="183" class="sub">Silicon insulation punctures. The pin is destroyed forever!</text>
  </g>

  <!-- Right: Two Safe Solutions -->
  <g transform="translate(435, 85)">
    <rect x="0" y="0" width="375" height="210" class="card" stroke="#3fb950" stroke-width="1.2"/>
    <text x="20" y="25" class="title" fill="#3fb950">✅ SAFE CONVERSION METHODS</text>
    <text x="20" y="42" class="sub">Step down to ≤ 3.3V before reaching the ESP32 pin</text>

    <!-- Method 1: Resistor Divider (1-Way) -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="335" height="55" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="15" y="20" class="mono" fill="#58a6ff">1. Resistor Divider (Sensor → ESP32)</text>
      <text x="15" y="38" class="mono" fill="#3fb950" font-size="11px">5V ──[ 1kΩ ]──┬──► 3.33V to ESP32 Pin</text>
      <text x="110" y="48" class="sub" font-size="9px">│ [ 2kΩ ] ── GND</text>
    </g>

    <!-- Method 2: Logic Level Shifter (2-Way) -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="335" height="65" rx="6" fill="#0d1117" stroke="#3fb950"/>
      <text x="15" y="20" class="mono" fill="#3fb950">2. Bi-Directional Shifter (I²C / SPI)</text>
      <text x="15" y="38" class="sub">Connect 5V to HV, and 3.3V to LV</text>
      <text x="15" y="54" class="mono" fill="#7ee787" font-size="11px">Converts signals in both directions automatically!</text>
    </g>
  </g>
</svg>

