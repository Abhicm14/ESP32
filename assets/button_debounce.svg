<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 700; fill: #58a6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .ideal-wave { stroke: #58a6ff; stroke-width: 3; fill: none; }
      .bounce-wave { stroke: #f85149; stroke-width: 2.5; fill: none; animation: jitter 0.5s infinite alternate; }
      .debounced-wave { stroke: #3fb950; stroke-width: 3; fill: none; }
      @keyframes jitter {
        from { transform: translateX(0); }
        to { transform: translateX(1.5px); }
      }
    </style>
  </defs>

  <rect x="15" y="15" width="820" height="310" class="bg" />
  <text x="35" y="45" class="header">🔘 BUTTON MECHANICAL BOUNCE &amp; DEBOUNCING</text>
  <text x="35" y="65" class="sub">Mechanical metal leaves chatter 30–50 times in 10ms when clicked!</text>

  <!-- Section 1: What You Think Happens -->
  <g transform="translate(35, 80)">
    <rect x="0" y="0" width="775" height="55" class="card"/>
    <text x="15" y="24" class="title" fill="#58a6ff">What You Think Happens (1 Clean Click):</text>
    <path d="M 400 35 L 530 35 L 530 18 L 740 18" class="ideal-wave"/>
    <text x="400" y="48" class="mono" fill="#8b949e" font-size="10px">HIGH (3.3V)</text>
    <text x="700" y="32" class="mono" fill="#58a6ff" font-size="10px">LOW (0V)</text>
  </g>

  <!-- Section 2: What the ESP32 Actually Sees (Violent Bouncing) -->
  <g transform="translate(35, 145)">
    <rect x="0" y="0" width="775" height="75" class="card" stroke="#f85149" stroke-width="1.2"/>
    <text x="15" y="24" class="title" fill="#f85149">What the ESP32 (240 MHz) Actually Sees:</text>
    <text x="15" y="42" class="sub">Metal leaves bounce repeatedly in 10ms → Counter registers 34 clicks!</text>

    <!-- Bounce Wave -->
    <path d="M 400 50 L 480 50 L 485 30 L 490 50 L 495 28 L 500 50 L 505 32 L 510 50 L 515 30 L 520 50 L 525 28 L 535 28 L 740 28" class="bounce-wave"/>
    <rect x="480" y="15" width="55" height="45" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-dasharray="2 2"/>
    <text x="475" y="68" class="mono" fill="#f85149" font-size="10px">~10ms Chatter!</text>
  </g>

  <!-- Section 3: The Two Solutions -->
  <g transform="translate(35, 230)">
    <rect x="0" y="0" width="775" height="75" class="card" stroke="#3fb950" stroke-width="1.2"/>
    <text x="15" y="24" class="title" fill="#3fb950">How to Fix It (Debouncing):</text>
    
    <g transform="translate(15, 32)">
      <text x="0" y="15" class="mono" fill="#58a6ff">1. Software Debounce:</text>
      <text x="175" y="15" class="sub">Wait 20ms in code: <tspan fill="#e6edf3" font-family="monospace">delay(20);</tspan> before checking pin again.</text>
      <text x="0" y="32" class="mono" fill="#3fb950">2. Hardware RC Filter:</text>
      <text x="175" y="32" class="sub">Connect <tspan fill="#e6edf3" font-family="monospace">10 kΩ resistor + 100 nF capacitor</tspan> across the button to absorb ripples.</text>
    </g>

    <path d="M 620 55 L 680 55 L 680 35 L 750 35" class="debounced-wave"/>
  </g>
</svg>
