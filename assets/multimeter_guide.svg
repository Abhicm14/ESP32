<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #58a6ff; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #8b949e; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.2; rx: 8px; }
      .meter-body { fill: #21262d; stroke: #f0883e; stroke-width: 3.5; rx: 16px; }
      .lcd { fill: #0d1117; stroke: #30363d; stroke-width: 2; rx: 6px; }
      .lcd-text { font-family: ui-monospace, SFMono-Regular, "Courier New", monospace; font-size: 24px; font-weight: 700; fill: #3fb950; letter-spacing: 2px; }
      .lcd-sub { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; fill: #8b949e; }
      .dial { fill: #161b22; stroke: #484f58; stroke-width: 2; }
      .dial-pointer { stroke: #f0883e; stroke-width: 3.5; stroke-linecap: round; }
      .jack { fill: #0d1117; stroke: #484f58; stroke-width: 2; }
      .probe-red { stroke: #f85149; stroke-width: 3; fill: none; }
      .probe-black { stroke: #58a6ff; stroke-width: 3; fill: none; }
      
      @keyframes beep-wave {
        0% { opacity: 0; transform: scale(0.8); }
        50% { opacity: 1; }
        100% { opacity: 0; transform: scale(1.25); }
      }
      .sound-wave { transform-origin: 200px 35px; animation: beep-wave 1.5s infinite ease-out; }
      
      @keyframes glow-beep {
        0%, 100% { fill: #3fb950; filter: drop-shadow(0 0 2px #2ea043); }
        50% { fill: #7ee787; filter: drop-shadow(0 0 8px #3fb950); }
      }
      .anim-lcd { animation: glow-beep 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect x="15" y="15" width="930" height="480" class="bg" />
  <text x="35" y="44" class="header">📟 THE MULTIMETER: MEASUREMENT MODES &amp; CONTINUITY PROTOCOL</text>
  <text x="35" y="63" class="sub">Verify voltage rails, test resistor values, and run the life-saving continuity check before plugging USB power in</text>

  <!-- Left: The Digital Multimeter Graphic -->
  <g transform="translate(35, 80)">
    <!-- Outer Shockproof Body -->
    <rect x="0" y="0" width="235" height="395" class="meter-body" />

    <!-- LCD Display -->
    <rect x="20" y="22" width="195" height="72" class="lcd" />
    <text x="35" y="66" class="lcd-text anim-lcd">3.30 V</text>
    <text x="148" y="44" class="lcd-sub">DC AUTO</text>
    <text x="152" y="78" font-size="14">⚡</text>

    <!-- Rotary Function Dial -->
    <circle cx="118" cy="180" r="54" class="dial" />
    <circle cx="118" cy="180" r="45" fill="#21262d" />
    <!-- Indicator Notch pointing to Continuity / V -->
    <line x1="118" y1="180" x2="84" y2="146" class="dial-pointer" />
    <circle cx="118" cy="180" r="10" fill="#f0883e" />

    <!-- Dial Function Labels -->
    <text x="56" y="136" font-family="sans-serif" font-size="12" font-weight="700" fill="#58a6ff">V⎓</text>
    <text x="155" y="136" font-family="sans-serif" font-size="12" font-weight="700" fill="#3fb950">Ω</text>
    <text x="66" y="212" font-family="sans-serif" font-size="13" font-weight="700" fill="#d29922">•)))</text>
    <text x="155" y="212" font-family="sans-serif" font-size="11" font-weight="700" fill="#f85149">mA/A</text>
    <text x="106" y="248" font-family="sans-serif" font-size="11" font-weight="700" fill="#8b949e">OFF</text>

    <!-- Banana Input Jacks -->
    <!-- 10A Jack -->
    <circle cx="48" cy="320" r="14" class="jack" />
    <circle cx="48" cy="320" r="8" fill="#f85149" />
    <text x="36" y="348" font-family="sans-serif" font-size="9" fill="#8b949e">10A Max</text>

    <!-- COM Jack (Black Probe) -->
    <circle cx="118" cy="320" r="14" class="jack" />
    <circle cx="118" cy="320" r="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="103" y="348" font-family="sans-serif" font-size="10" font-weight="700" fill="#58a6ff">COM (−)</text>

    <!-- V-Ω-mA Jack (Red Probe) -->
    <circle cx="188" cy="320" r="14" class="jack" />
    <circle cx="188" cy="320" r="8" fill="#f85149" />
    <text x="168" y="348" font-family="sans-serif" font-size="9" font-weight="700" fill="#f85149">V·Ω·mA (+)</text>

    <!-- Golden Rule Label at meter bottom -->
    <text x="18" y="380" font-family="sans-serif" font-size="10.5" fill="#e6edf3" font-weight="600">Black in COM • Red in V·Ω·mA</text>
  </g>

  <!-- Top-Right: The Life-Saving Continuity Test Protocol -->
  <g transform="translate(295, 80)">
    <rect x="0" y="0" width="630" height="185" class="card" stroke="#d29922" stroke-width="1.5"/>
    <text x="20" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#d29922">⚡ THE LIFE-SAVING PROTOCOL: BEEP-TEST 3.3V TO GND BEFORE POWER ON</text>
    <text x="20" y="44" class="sub" font-size="11">Place Black probe on GND rail and Red probe on 3.3V rail with power OFF to detect fatal short circuits.</text>

    <!-- Case A: Silent (Safe) -->
    <g transform="translate(20, 56)">
      <rect x="0" y="0" width="285" height="114" rx="6" fill="#152119" stroke="#3fb950" stroke-width="1.5"/>
      <text x="15" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3fb950">✅ CASE A: SILENT (NO BEEP)</text>
      <text x="15" y="46" class="sub" font-size="11" fill="#e6edf3">Display: <tspan fill="#3fb950" font-weight="bold">"OL"</tspan> or high resistance (kΩ / MΩ)</text>
      <text x="15" y="66" class="sub" font-size="11">Meaning: No short circuit between 3.3V &amp; GND.</text>
      <text x="15" y="84" class="sub" font-size="11">Components are wired correctly.</text>
      <rect x="15" y="92" width="255" height="18" rx="3" fill="#238636"/>
      <text x="22" y="105" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff">SAFE TO PLUG IN USB CABLE 🚀</text>
    </g>

    <!-- Case B: Beep (Deadly Short) -->
    <g transform="translate(325, 56)">
      <rect x="0" y="0" width="285" height="114" rx="6" fill="#261719" stroke="#f85149" stroke-width="1.5"/>
      <text x="15" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f85149">💥 CASE B: LOUD BEEP (0.00 Ω)</text>
      <text x="15" y="46" class="sub" font-size="11" fill="#e6edf3">Display: <tspan fill="#f85149" font-weight="bold">"0.00 Ω"</tspan> with loud audio beep!</text>
      <text x="15" y="66" class="sub" font-size="11">Meaning: Direct short 3.3V to GND rail!</text>
      <text x="15" y="84" class="sub" font-size="11">A wire or IC is reversed or bridged.</text>
      <rect x="15" y="92" width="255" height="18" rx="3" fill="#da3633"/>
      <text x="22" y="105" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff">DO NOT POWER UP! FIND SHORT 🛑</text>
    </g>
  </g>

  <!-- Bottom-Right: 4 Measurement Modes (2x2 Grid) -->
  <g transform="translate(295, 280)">
    <!-- Mode 1: Continuity -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="305" height="92" class="card" stroke="#d29922" stroke-width="1.2"/>
      <text x="16" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d29922">•))) Continuity Check</text>
      <rect x="215" y="12" width="76" height="16" rx="3" fill="#9e6a03"/>
      <text x="222" y="24" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#ffffff">Power OFF ⚠️</text>
      <text x="16" y="44" class="sub" font-size="11">Beeps if resistance &lt; 50 Ω (closed copper wire).</text>
      <text x="16" y="62" class="sub" font-size="11">Tests wire integrity, solder joints, &amp; shorts.</text>
      <text x="16" y="80" class="sub" font-size="10.5" fill="#d29922">Touch probes together first to verify beep works!</text>
    </g>

    <!-- Mode 2: DC Voltage -->
    <g transform="translate(325, 0)">
      <rect x="0" y="0" width="305" height="92" class="card" stroke="#58a6ff" stroke-width="1.2"/>
      <text x="16" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#58a6ff">V⎓ DC Voltage</text>
      <rect x="215" y="12" width="76" height="16" rx="3" fill="#1f6feb"/>
      <text x="222" y="24" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#ffffff">Power ON ✅</text>
      <text x="16" y="44" class="sub" font-size="11">Measures potential difference across two points.</text>
      <text x="16" y="62" class="sub" font-size="11">Black on GND rail, Red on test point pin.</text>
      <text x="16" y="80" class="sub" font-size="10.5" fill="#58a6ff">Verify ESP32 rails are exactly 3.3V and 5.0V.</text>
    </g>

    <!-- Mode 3: Resistance -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="305" height="92" class="card" stroke="#3fb950" stroke-width="1.2"/>
      <text x="16" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3fb950">Ω Resistance</text>
      <rect x="215" y="12" width="76" height="16" rx="3" fill="#238636"/>
      <text x="222" y="24" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#ffffff">Power OFF ⚠️</text>
      <text x="16" y="44" class="sub" font-size="11">Measures ohms of unpowered resistors &amp; sensors.</text>
      <text x="16" y="62" class="sub" font-size="11">Identifies resistor values (220Ω vs 10kΩ colors).</text>
      <text x="16" y="80" class="sub" font-size="10.5" fill="#3fb950">Disconnect one leg from circuit for accurate read.</text>
    </g>

    <!-- Mode 4: Current -->
    <g transform="translate(325, 102)">
      <rect x="0" y="0" width="305" height="92" class="card" stroke="#f85149" stroke-width="1.2"/>
      <text x="16" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f85149">mA / A Current Flow</text>
      <rect x="200" y="12" width="91" height="16" rx="3" fill="#da3633"/>
      <text x="206" y="24" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#ffffff">Break Circuit ⚠️</text>
      <text x="16" y="44" class="sub" font-size="11">Measures electron flow. Meter acts as wire bridge.</text>
      <text x="16" y="62" class="sub" font-size="11">Must wire in SERIES (never in parallel like volts)!</text>
      <text x="16" y="80" class="sub" font-size="10.5" fill="#f85149">🛑 NEVER connect across 3.3V &amp; GND (blows fuse)!</text>
    </g>
  </g>
</svg>
