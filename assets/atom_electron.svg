<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #58a6ff; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #e6edf3; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
      .orbit { fill: none; stroke: #30363d; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .electron { fill: #58a6ff; filter: drop-shadow(0 0 6px #58a6ff); }
      .nucleus { fill: #f85149; filter: drop-shadow(0 0 8px #da3633); }
      .neutron { fill: #8b949e; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="15" y="15" width="620" height="220" class="bg" />
  <text x="35" y="42" class="header">⚛️ The Atom &amp; Free Electrons</text>
  <text x="35" y="60" class="sub">Outer electrons hop between copper atoms to create electrical current</text>

  <!-- Left: The Atom Model -->
  <g transform="translate(150, 142)">
    <!-- Orbit 1 (-30 deg) -->
    <g transform="rotate(-30)">
      <ellipse cx="0" cy="0" rx="72" ry="28" class="orbit"/>
      <circle cx="0" cy="0" r="5.5" class="electron">
        <animateMotion path="M -72,0 A 72,28 0 0,1 72,0 A 72,28 0 0,1 -72,0" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Orbit 2 (+30 deg) -->
    <g transform="rotate(30)">
      <ellipse cx="0" cy="0" rx="72" ry="28" class="orbit"/>
      <circle cx="0" cy="0" r="5.5" class="electron">
        <animateMotion path="M 72,0 A 72,28 0 0,1 -72,0 A 72,28 0 0,1 72,0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Orbit 3 (+90 deg) -->
    <g transform="rotate(90)">
      <ellipse cx="0" cy="0" rx="72" ry="28" class="orbit"/>
      <circle cx="0" cy="0" r="5.5" class="electron">
        <animateMotion path="M -72,0 A 72,28 0 0,1 72,0 A 72,28 0 0,1 -72,0" dur="3.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Nucleus Center (Protons & Neutrons) -->
    <g>
      <circle cx="-5" cy="-5" r="9" class="nucleus"/>
      <circle cx="5" cy="-5" r="9" class="neutron"/>
      <circle cx="-5" cy="5" r="9" class="neutron"/>
      <circle cx="5" cy="5" r="9" class="nucleus"/>
      <text x="-4" y="-1" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="bold">+</text>
      <text x="6" y="9" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="bold">+</text>
    </g>
  </g>

  <!-- Right: Explanatory Callouts -->
  <g transform="translate(275, 82)">
    <!-- Protons -->
    <circle cx="15" cy="15" r="8" class="nucleus"/>
    <text x="11" y="19" font-family="sans-serif" font-size="11" fill="#fff" font-weight="bold">+</text>
    <text x="35" y="15" class="label">Protons (+)</text>
    <text x="35" y="28" class="sub">Heavy positive core locked inside nucleus</text>

    <!-- Electrons -->
    <circle cx="15" cy="52" r="6" class="electron"/>
    <text x="12" y="55" font-family="sans-serif" font-size="10" fill="#fff" font-weight="bold">−</text>
    <text x="35" y="52" class="label" fill="#58a6ff">Electrons (−)</text>
    <text x="35" y="65" class="sub">Lightweight negative charges orbiting the nucleus</text>

    <!-- Electricity definition box -->
    <rect x="0" y="85" width="335" height="52" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="14" y="106" class="label" fill="#3fb950" font-weight="bold">Electricity = Flow of Electrons</text>
    <text x="14" y="124" class="sub">Conductors (copper) let outer valence electrons hop freely!</text>
  </g>
</svg>
