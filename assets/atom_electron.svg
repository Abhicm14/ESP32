<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #58a6ff; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #e6edf3; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
      .orbit { fill: none; stroke: #30363d; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .electron { fill: #58a6ff; filter: drop-shadow(0 0 6px #58a6ff); }
      .nucleus { fill: #f85149; filter: drop-shadow(0 0 8px #da3633); }
      .neutron { fill: #8b949e; }
    </style>
  </defs>

  <rect x="15" y="15" width="570" height="210" class="bg" />
  <text x="35" y="42" class="header">⚛️ The Atom &amp; Free Electrons</text>
  <text x="35" y="60" class="sub">Outer electrons hop between copper atoms to create electrical current</text>

  <!-- Left: The Atom Model -->
  <g transform="translate(140, 135)">
    <!-- Orbit 1 -->
    <ellipse cx="0" cy="0" rx="85" ry="32" class="orbit" transform="rotate(-30)"/>
    <!-- Orbit 2 -->
    <ellipse cx="0" cy="0" rx="85" ry="32" class="orbit" transform="rotate(30)"/>
    <!-- Orbit 3 -->
    <ellipse cx="0" cy="0" rx="85" ry="32" class="orbit" transform="rotate(90)"/>

    <!-- Nucleus Center (Protons & Neutrons) -->
    <circle cx="-6" cy="-6" r="10" class="nucleus"/>
    <circle cx="6" cy="-6" r="10" class="neutron"/>
    <circle cx="-6" cy="6" r="10" class="neutron"/>
    <circle cx="6" cy="6" r="10" class="nucleus"/>
    <text x="-4" y="-2" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="bold">+</text>
    <text x="8" y="10" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="bold">+</text>

    <!-- Orbiting Animated Electrons -->
    <g>
      <circle cx="0" cy="0" r="6" class="electron">
        <animateMotion path="M -73 -42 A 85 32 0 1 1 73 42 A 85 32 0 1 1 -73 -42" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="0" cy="0" r="6" class="electron">
        <animateMotion path="M -73 42 A 85 32 0 1 1 73 -42 A 85 32 0 1 1 -73 42" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="0" cy="0" r="6" class="electron">
        <animateMotion path="M 0 -85 A 32 85 0 1 1 0 85 A 32 85 0 1 1 0 -85" dur="3.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Right: Explanatory Callouts -->
  <g transform="translate(280, 85)">
    <!-- Protons -->
    <circle cx="15" cy="15" r="8" class="nucleus"/>
    <text x="11" y="19" font-family="sans-serif" font-size="11" fill="#fff" font-weight="bold">+</text>
    <text x="35" y="15" class="label">Protons (+)</text>
    <text x="35" y="28" class="sub">Heavy center, locked inside nucleus</text>

    <!-- Electrons -->
    <circle cx="15" cy="55" r="6" class="electron"/>
    <text x="12" y="58" font-family="sans-serif" font-size="10" fill="#fff" font-weight="bold">−</text>
    <text x="35" y="55" class="label" fill="#58a6ff">Electrons (−)</text>
    <text x="35" y="68" class="sub">Lightweight, free to hop in conductors</text>

    <!-- Electricity definition -->
    <rect x="0" y="85" width="280" height="42" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="12" y="103" class="label" fill="#3fb950" font-weight="bold">Electricity = Flow of Electrons</text>
    <text x="12" y="118" class="sub">Conductors (copper) let billions flow freely!</text>
  </g>
</svg>
