<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 700; fill: #58a6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #8b949e; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.2; rx: 8px; }
      .chip { fill: #21262d; stroke: #58a6ff; stroke-width: 1.5; rx: 5px; }
      .resistor { fill: #21262d; stroke: #d29922; stroke-width: 1.5; rx: 3px; }
      
      /* Animated Current Flows */
      .signal-flow { stroke: #58a6ff; stroke-width: 2.5; fill: none; stroke-dasharray: 6 4; animation: sig-flow 1.5s linear infinite; }
      .load-flow-5v { stroke: #3fb950; stroke-width: 3.5; fill: none; stroke-dasharray: 6 4; animation: pwr-flow 1s linear infinite; }
      .load-flow-12v { stroke: #f85149; stroke-width: 4; fill: none; stroke-dasharray: 8 5; animation: pwr-flow 0.7s linear infinite; }
      
      @keyframes sig-flow { to { stroke-dashoffset: -20; } }
      @keyframes pwr-flow { to { stroke-dashoffset: -26; } }
      
      /* Motor Spinning */
      @keyframes spin-gear {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .gear-spin { transform-origin: 50px 70px; animation: spin-gear 2s linear infinite; }
    </style>
  </defs>

  <!-- Outer Canvas -->
  <rect x="15" y="15" width="850" height="380" class="bg" />
  <text x="35" y="44" class="header">💪 TRANSISTORS &amp; MOSFETs: COMPLETE SWITCHING CIRCUITS</text>
  <text x="35" y="63" class="sub" font-size="11px">A tiny 3.3V GPIO signal controls heavy 5V/12V loads safely through an electronic switch</text>

  <!-- LEFT CARD: NPN BJT (2N2222) -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="395" height="285" class="card" stroke="#3fb950" stroke-width="1.2"/>
    <text x="18" y="24" class="title" fill="#3fb950">1. NPN BJT Transistor (e.g. 2N2222)</text>
    <text x="18" y="38" class="sub">Loads ≤ 500mA (Relays, Buzzers) • Current-driven</text>

    <!-- +5V Power Supply Rail -->
    <circle cx="280" cy="58" r="6" fill="#3fb950"/>
    <text x="295" y="62" class="mono" fill="#3fb950" font-weight="bold">+5V VCC</text>
    <path d="M 280 64 L 280 82" class="load-flow-5v"/>

    <!-- 5V Relay / Buzzer Load -->
    <g transform="translate(230, 82)">
      <rect x="0" y="0" width="100" height="42" rx="5" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
      <text x="12" y="18" class="mono" fill="#e6edf3">5V Relay Coil</text>
      <text x="12" y="32" class="sub" fill="#3fb950">Draws 70 mA</text>
      
      <!-- Flyback Diode across coil -->
      <path d="M -15 8 L 0 8" stroke="#d29922" stroke-width="1.8"/>
      <polygon points="-15,18 -15,-2 -5,8" fill="#d29922"/>
      <line x1="-5" y1="-2" x2="-5" y2="18" stroke="#d29922" stroke-width="2"/>
      <path d="M -5 8 L 0 8" stroke="#d29922" stroke-width="1.8"/>
      <path d="M -15 34 L 0 34" stroke="#d29922" stroke-width="1.8"/>
      <path d="M -15 8 L -15 34" stroke="#d29922" stroke-width="1.8"/>
      <text x="-48" y="24" class="sub" fill="#d29922">1N4148</text>
    </g>

    <!-- Wire from Load to Collector -->
    <path d="M 280 124 L 280 152" class="load-flow-5v"/>

    <!-- ESP32 Side -->
    <g transform="translate(18, 140)">
      <rect x="0" y="0" width="80" height="65" class="chip"/>
      <text x="18" y="24" class="mono" fill="#58a6ff" font-weight="bold">ESP32</text>
      <circle cx="80" cy="35" r="4" fill="#58a6ff"/>
      <text x="14" y="42" class="mono" font-size="10px">GPIO 4</text>
      <circle cx="80" cy="55" r="4" fill="#8b949e"/>
      <text x="24" y="58" class="sub">GND</text>
    </g>

    <!-- Base Resistor (1k) -->
    <path d="M 98 175 L 132 175" class="signal-flow"/>
    <rect x="132" y="167" width="40" height="16" class="resistor"/>
    <text x="138" y="179" class="mono" fill="#d29922" font-size="9px">1 kΩ</text>
    <path d="M 172 175 L 210 175" class="signal-flow"/>
    <text x="120" y="158" class="sub">Base limit</text>

    <!-- NPN Transistor Symbol -->
    <g transform="translate(250, 175)">
      <circle cx="0" cy="0" r="28" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <!-- Base Bar -->
      <line x1="-40" y1="0" x2="-10" y2="0" class="signal-flow"/>
      <line x1="-10" y1="-18" x2="-10" y2="18" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="-25" y="-6" class="mono" fill="#58a6ff">B</text>
      <!-- Collector -->
      <line x1="-10" y1="-8" x2="16" y2="-23" stroke="#e6edf3" stroke-width="2.2"/>
      <line x1="16" y1="-23" x2="30" y2="-23" stroke="#e6edf3" stroke-width="2.2"/>
      <text x="22" y="-30" class="mono" fill="#3fb950">C</text>
      <!-- Emitter with Arrow -->
      <line x1="-10" y1="8" x2="16" y2="23" stroke="#e6edf3" stroke-width="2.2"/>
      <polygon points="16,23 6,17 11,12" fill="#3fb950"/>
      <line x1="16" y1="23" x2="30" y2="23" stroke="#e6edf3" stroke-width="2.2"/>
      <text x="22" y="38" class="mono" fill="#8b949e">E</text>
    </g>

    <!-- Emitter to Common Ground -->
    <path d="M 280 198 L 280 240 L 98 240 L 98 195" class="load-flow-5v"/>
    <circle cx="280" cy="240" r="4" fill="#8b949e"/>
    <path d="M 280 240 L 280 265" stroke="#8b949e" stroke-width="2.5"/>
    <line x1="268" y1="265" x2="292" y2="265" stroke="#8b949e" stroke-width="2.5"/>
    <line x1="272" y1="270" x2="288" y2="270" stroke="#8b949e" stroke-width="2"/>
    <line x1="276" y1="275" x2="284" y2="275" stroke="#8b949e" stroke-width="1.5"/>
    <text x="120" y="255" class="sub">Common GND ties ESP32 &amp; 5V together</text>
  </g>

  <!-- RIGHT CARD: N-CHANNEL LOGIC MOSFET (IRLZ44N) -->
  <g transform="translate(450, 80)">
    <rect x="0" y="0" width="395" height="285" class="card" stroke="#f85149" stroke-width="1.2"/>
    <text x="18" y="24" class="title" fill="#f85149">2. N-Channel Power MOSFET (e.g. IRLZ44N)</text>
    <text x="18" y="38" class="sub">Loads up to 30A (Motors, LED strips) • Voltage-driven</text>

    <!-- +12V High-Power Rail -->
    <circle cx="280" cy="58" r="6" fill="#f85149"/>
    <text x="295" y="62" class="mono" fill="#f85149" font-weight="bold">+12V High-Power</text>
    <path d="M 280 64 L 280 82" class="load-flow-12v"/>

    <!-- 12V DC Motor Load -->
    <g transform="translate(230, 82)">
      <rect x="0" y="0" width="105" height="42" rx="5" fill="#21262d" stroke="#f85149" stroke-width="1.5"/>
      <text x="12" y="18" class="mono" fill="#e6edf3">12V DC Motor</text>
      <text x="12" y="32" class="sub" fill="#ff7b72">Draws 2.0 Amperes</text>
      
      <!-- Flyback Diode across motor (1N4007) -->
      <path d="M -15 8 L 0 8" stroke="#d29922" stroke-width="1.8"/>
      <polygon points="-15,18 -15,-2 -5,8" fill="#d29922"/>
      <line x1="-5" y1="-2" x2="-5" y2="18" stroke="#d29922" stroke-width="2"/>
      <path d="M -5 8 L 0 8" stroke="#d29922" stroke-width="1.8"/>
      <path d="M -15 34 L 0 34" stroke="#d29922" stroke-width="1.8"/>
      <path d="M -15 8 L -15 34" stroke="#d29922" stroke-width="1.8"/>
      <text x="-48" y="24" class="sub" fill="#d29922">1N4007</text>
    </g>

    <!-- Wire from Motor to Drain -->
    <path d="M 280 124 L 280 152" class="load-flow-12v"/>

    <!-- ESP32 Side -->
    <g transform="translate(18, 140)">
      <rect x="0" y="0" width="80" height="65" class="chip"/>
      <text x="18" y="24" class="mono" fill="#58a6ff" font-weight="bold">ESP32</text>
      <circle cx="80" cy="35" r="4" fill="#58a6ff"/>
      <text x="14" y="42" class="mono" font-size="10px">GPIO 5</text>
      <circle cx="80" cy="55" r="4" fill="#8b949e"/>
      <text x="24" y="58" class="sub">GND</text>
    </g>

    <!-- Gate Resistor (100 Ohm) -->
    <path d="M 98 175 L 126 175" class="signal-flow"/>
    <rect x="126" y="167" width="36" height="16" class="resistor"/>
    <text x="130" y="179" class="mono" fill="#d29922" font-size="9px">100Ω</text>
    <path d="M 162 175 L 210 175" class="signal-flow"/>

    <!-- 10k Pull-down Resistor to Ground -->
    <circle cx="185" cy="175" r="3" fill="#58a6ff"/>
    <line x1="185" y1="175" x2="185" y2="202" stroke="#d29922" stroke-width="1.8"/>
    <rect x="174" y="202" width="22" height="28" class="resistor"/>
    <text x="177" y="220" class="sub" fill="#d29922" font-size="8.5px">10k</text>
    <line x1="185" y1="230" x2="185" y2="240" stroke="#8b949e" stroke-width="1.8"/>
    <circle cx="185" cy="240" r="3" fill="#8b949e"/>

    <!-- MOSFET Symbol -->
    <g transform="translate(250, 175)">
      <circle cx="0" cy="0" r="28" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <!-- Gate -->
      <line x1="-40" y1="0" x2="-14" y2="0" class="signal-flow"/>
      <line x1="-14" y1="-18" x2="-14" y2="18" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="-26" y="-6" class="mono" fill="#58a6ff">G</text>
      <!-- Channel Bars -->
      <line x1="-6" y1="-15" x2="-6" y2="-5" stroke="#e6edf3" stroke-width="2.5"/>
      <line x1="-6" y1="-3" x2="-6" y2="3" stroke="#e6edf3" stroke-width="2.5"/>
      <line x1="-6" y1="5" x2="-6" y2="15" stroke="#e6edf3" stroke-width="2.5"/>
      <!-- Drain Lead -->
      <line x1="-6" y1="-10" x2="16" y2="-10" stroke="#e6edf3" stroke-width="2.2"/>
      <line x1="16" y1="-10" x2="30" y2="-23" stroke="#e6edf3" stroke-width="2.2"/>
      <text x="22" y="-30" class="mono" fill="#f85149">D</text>
      <!-- Source Lead with Body Arrow -->
      <line x1="-6" y1="10" x2="16" y2="10" stroke="#e6edf3" stroke-width="2.2"/>
      <polygon points="-5,0 5,-4 5,4" fill="#58a6ff"/>
      <line x1="5" y1="0" x2="16" y2="0" stroke="#e6edf3" stroke-width="1.8"/>
      <line x1="16" y1="0" x2="16" y2="10" stroke="#e6edf3" stroke-width="1.8"/>
      <line x1="16" y1="10" x2="30" y2="23" stroke="#e6edf3" stroke-width="2.2"/>
      <text x="22" y="38" class="mono" fill="#8b949e">S</text>
    </g>

    <!-- Source to Common Ground -->
    <path d="M 280 198 L 280 240 L 98 240 L 98 195" class="load-flow-12v"/>
    <circle cx="280" cy="240" r="4" fill="#8b949e"/>
    <path d="M 280 240 L 280 265" stroke="#8b949e" stroke-width="2.5"/>
    <line x1="268" y1="265" x2="292" y2="265" stroke="#8b949e" stroke-width="2.5"/>
    <line x1="272" y1="270" x2="288" y2="270" stroke="#8b949e" stroke-width="2"/>
    <line x1="276" y1="275" x2="284" y2="275" stroke="#8b949e" stroke-width="1.5"/>
    <text x="120" y="255" class="sub">10k pull-down prevents floating on boot</text>
  </g>
</svg>
