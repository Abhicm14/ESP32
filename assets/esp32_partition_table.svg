<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.2; rx: 8px; }
      .header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; }
      .mono-sm { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
      .badge { font-family: ui-monospace, SFMono-Regular, "SF Mono", monospace; font-size: 9.5px; font-weight: 700; }

      /* OTA pointer animation */
      .ota-arrow { stroke: #3fb950; stroke-width: 2.5; stroke-dasharray: 6 4; animation: ota-dash 1.8s linear infinite; fill: none; }
      @keyframes ota-dash { to { stroke-dashoffset: -20; } }

      .ping-active { fill: #3fb950; filter: drop-shadow(0 0 6px #3fb950); animation: pulse-ota 2s ease-in-out infinite alternate; }
      @keyframes pulse-ota { from { opacity: 0.5; } to { opacity: 1.0; } }
    </style>
  </defs>

  <!-- Outer Canvas -->
  <rect x="10" y="10" width="900" height="520" class="bg" />

  <!-- Title & Subtitle -->
  <text x="35" y="38" class="header" fill="#58a6ff">🗂️ ESP32 4 MB FLASH PARTITION MAP &amp; DUAL OTA UPDATES</text>
  <text x="35" y="56" class="sub">How Flash memory is partitioned into bootloader, partition table, NVS, Dual OTA app slots, and filesystem</text>

  <!-- ================= TOP: FLASH MEMORY BAR VISUALIZATION ================= -->
  <g transform="translate(35, 72)">
    <rect x="0" y="0" width="850" height="118" class="card" fill="#13171f" stroke="#30363d" />
    <text x="15" y="22" class="title" fill="#e6edf3">4 MB (0x400000 BYTES) PHYSICAL FLASH MEMORY MAP</text>
    
    <!-- Visual Slices Bar (Total bar width: 820px, from x=15 to x=835) -->
    <g transform="translate(15, 34)">
      <!-- Bootloader & System (0x0 - 0x9000): ~36 KB -> 40 px -->
      <rect x="0" y="0" width="40" height="36" rx="3" fill="#1f3b4d" stroke="#58a6ff" stroke-width="1" />
      <text x="7" y="22" class="mono-sm" fill="#58a6ff">Boot</text>

      <!-- NVS & OTA Data (0x9000 - 0x10000): ~28 KB -> 40 px -->
      <rect x="44" y="0" width="40" height="36" rx="3" fill="#3b2b11" stroke="#d29922" stroke-width="1" />
      <text x="51" y="22" class="mono-sm" fill="#ffd33d">NVS</text>

      <!-- ota_0 App (0x10000 - 0x1A0000): 1.6 MB -> 340 px -->
      <rect x="88" y="0" width="340" height="36" rx="3" fill="#14331b" stroke="#3fb950" stroke-width="1.5" />
      <circle cx="106" cy="18" r="4.5" class="ping-active" />
      <text x="118" y="22" class="title" fill="#7ee787">ota_0 (Active App) • 1.6 MB</text>

      <!-- ota_1 App (0x1A0000 - 0x330000): 1.6 MB -> 300 px -->
      <rect x="432" y="0" width="300" height="36" rx="3" fill="#182538" stroke="#58a6ff" stroke-width="1" />
      <text x="444" y="22" class="title" fill="#58a6ff">ota_1 (Staging Slot) • 1.6 MB</text>

      <!-- Storage (0x330000 - 0x400000): ~832 KB -> 84 px -->
      <rect x="736" y="0" width="84" height="36" rx="3" fill="#301c4d" stroke="#bc8cff" stroke-width="1" />
      <text x="746" y="22" class="mono-sm" fill="#bc8cff">SPIFFS (FS)</text>
    </g>

    <!-- Address Labels Below Bar (Strictly Non-Overlapping Layout) -->
    <!-- Row 1: Hex Offsets -->
    <text x="15" y="90" class="mono-sm" fill="#8b949e">0x000000</text>
    <text x="103" y="90" class="mono-sm" fill="#7ee787">0x010000 (ota_0)</text>
    <text x="447" y="90" class="mono-sm" fill="#58a6ff">0x1A0000 (ota_1)</text>
    <text x="735" y="90" class="mono-sm" fill="#bc8cff">0x330000</text>
    <text x="795" y="90" class="mono-sm" fill="#8b949e">0x400000</text>

    <!-- Row 2: Partition Descriptions -->
    <text x="15" y="106" class="sub">Boot / NVS</text>
    <text x="103" y="106" class="sub">Primary Firmware Slot</text>
    <text x="447" y="106" class="sub">OTA Staging Firmware Slot</text>
    <text x="715" y="106" class="sub">LittleFS Storage</text>
  </g>

  <!-- ================= MIDDLE LEFT: CSV PARTITION TABLE ================= -->
  <g transform="translate(35, 198)">
    <rect x="0" y="0" width="415" height="205" class="card" stroke="#58a6ff" stroke-width="1.2" />
    <text x="15" y="22" class="title" fill="#58a6ff">CUSTOM CSV DEFINITION (partitions.csv)</text>
    <text x="15" y="38" class="sub">Standard Dual-OTA with Rollback Partition Configuration</text>
    
    <!-- Code Box -->
    <rect x="12" y="48" width="390" height="145" rx="4" fill="#0d1117" stroke="#30363d" />
    <text x="20" y="68" class="mono-sm" fill="#8b949e"># Name,    Type, SubType, Offset,   Size, Flags</text>
    <text x="20" y="86" class="mono-sm" fill="#ffd33d">nvs,       data, nvs,     0x9000,   0x4000,</text>
    <text x="20" y="104" class="mono-sm" fill="#ffd33d">otadata,   data, ota,     0xd000,   0x2000,</text>
    <text x="20" y="122" class="mono-sm" fill="#7ee787">ota_0,     app,  ota_0,   0x10000,  0x190000,</text>
    <text x="20" y="140" class="mono-sm" fill="#58a6ff">ota_1,     app,  ota_1,   0x1A0000, 0x190000,</text>
    <text x="20" y="158" class="mono-sm" fill="#bc8cff">storage,   data, spiffs,  0x330000, 0xD0000,</text>
    <text x="20" y="178" class="mono-sm" fill="#8b949e"># Total: 0x400000 bytes (Exactly 4 MB)</text>
  </g>

  <!-- ================= MIDDLE RIGHT: HOW OTA UPDATES WORK ================= -->
  <g transform="translate(470, 198)">
    <rect x="0" y="0" width="425" height="205" class="card" stroke="#3fb950" stroke-width="1.2" />
    <text x="15" y="22" class="title" fill="#3fb950">SEAMLESS OVER-THE-AIR (OTA) SAFETY</text>
    <text x="15" y="38" class="sub">Why ESP32 Devices Never Get Bricked During Remote Updates</text>
    
    <text x="15" y="62" class="sub">1️⃣ <tspan fill="#e6edf3" font-weight="600">Running State:</tspan> Device executes code from <tspan fill="#7ee787">ota_0</tspan>.</text>
    <text x="15" y="80" class="sub">2️⃣ <tspan fill="#e6edf3" font-weight="600">Download:</tspan> New firmware binary downloads into <tspan fill="#58a6ff">ota_1</tspan>.</text>
    <text x="15" y="96" class="sub">   (The running app is never overwritten or interrupted!)</text>
    
    <text x="15" y="118" class="sub">3️⃣ <tspan fill="#e6edf3" font-weight="600">Verification:</tspan> SHA-256 hash &amp; signature validated.</text>
    
    <text x="15" y="138" class="sub">4️⃣ <tspan fill="#e6edf3" font-weight="600">Boot Marker Flip:</tspan> <tspan fill="#ffd33d">otadata</tspan> sets <tspan fill="#58a6ff">ota_1</tspan> as next boot target.</text>
    
    <text x="15" y="158" class="sub">5️⃣ <tspan fill="#e6edf3" font-weight="600">Automatic Anti-Brick Rollback:</tspan></text>
    <text x="15" y="174" class="sub">   If the new firmware crashes or panics on startup, bootloader</text>
    <text x="15" y="190" class="sub">   reverts back to <tspan fill="#7ee787">ota_0</tspan>! Your device remains 100% operational.</text>
  </g>

  <!-- ================= BOTTOM: PARTITION ROLES BREAKDOWN ================= -->
  <g transform="translate(35, 412)">
    <rect x="0" y="0" width="850" height="98" class="card" fill="#13171f" stroke="#30363d" />
    <text x="18" y="20" class="title" fill="#e6edf3">PARTITION SUBTYPES &amp; ROLES</text>
    
    <text x="18" y="40" class="mono-sm" fill="#ffd33d">NVS (Non-Volatile Storage):</text>
    <text x="220" y="40" class="sub">Key-value database for Wi-Fi credentials, BLE bonds, calibration values.</text>

    <text x="18" y="60" class="mono-sm" fill="#58a6ff">OTA Data (otadata):</text>
    <text x="220" y="60" class="sub">Two 4 KB sectors tracking active app sequence number and rollback state.</text>

    <text x="18" y="80" class="mono-sm" fill="#bc8cff">File System (LittleFS/SPIFFS):</text>
    <text x="220" y="80" class="sub">Storage for web server HTML/CSS/JS assets, TLS certificates, and logs.</text>
  </g>

</svg>
