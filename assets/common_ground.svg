<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 700; fill: #58a6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .wire-data { stroke: #58a6ff; stroke-width: 2.5; stroke-dasharray: 6 4; animation: data-flow 1.5s linear infinite; }
      .wire-gnd { stroke: #8b949e; stroke-width: 3.5; stroke-linecap: round; }
      @keyframes data-flow { to { stroke-dashoffset: -20; } }
      .flicker-error { animation: blink-err 0.7s infinite alternate; }
      @keyframes blink-err { from { opacity: 0.3; } to { opacity: 1; } }
    </style>
  </defs>

  <rect x="15" y="15" width="820" height="290" class="bg" />
  <text x="35" y="45" class="header">⏚ THE COMMON GROUND RULE: THE SHARED ZERO REFERENCE</text>
  <text x="35" y="65" class="sub">Voltage is a difference between two points. Without a shared GND, chips cannot talk!</text>

  <!-- Left: The Missing Ground Disaster -->
  <g transform="translate(35, 80)">
    <rect x="0" y="0" width="375" height="195" class="card" stroke="#f85149" stroke-width="1.2"/>
    <text x="15" y="24" class="title" fill="#f85149">❌ MISSING GROUND = TOTAL GIBBERISH</text>

    <!-- ESP32 Box -->
    <rect x="20" y="45" width="85" height="60" rx="6" fill="#21262d" stroke="#58a6ff"/>
    <text x="38" y="72" class="mono" fill="#58a6ff">ESP32</text>
    <text x="30" y="90" class="sub" font-size="10px">(USB Power)</text>

    <!-- Sensor Box -->
    <rect x="270" y="45" width="85" height="60" rx="6" fill="#21262d" stroke="#3fb950"/>
    <text x="290" y="72" class="mono" fill="#3fb950">Sensor</text>
    <text x="282" y="90" class="sub" font-size="10px">(Battery Pack)</text>

    <!-- Data wire only -->
    <line x1="105" y1="65" x2="270" y2="65" stroke="#f85149" stroke-width="2.5" stroke-dasharray="4 4"/>
    <text x="150" y="58" class="mono" fill="#f85149" font-size="11px">SDA Data</text>

    <!-- Missing Ground Cross -->
    <line x1="105" y1="95" x2="165" y2="95" stroke="#8b949e" stroke-width="2"/>
    <line x1="210" y1="95" x2="270" y2="95" stroke="#8b949e" stroke-width="2"/>
    <text x="175" y="98" font-size="16" class="flicker-error">❌</text>
    <text x="135" y="115" class="sub" fill="#f85149" font-size="10px">NO GROUND WIRE!</text>

    <rect x="15" y="130" width="345" height="50" rx="6" fill="#0d1117" stroke="#f85149"/>
    <text x="25" y="150" class="mono flicker-error" fill="#f85149">Result: Floating Baselines!</text>
    <text x="25" y="168" class="sub">Battery 0V ≠ USB 0V. Data is completely scrambled!</text>
  </g>

  <!-- Right: Connected Common Ground -->
  <g transform="translate(435, 80)">
    <rect x="0" y="0" width="375" height="195" class="card" stroke="#3fb950" stroke-width="1.2"/>
    <text x="15" y="24" class="title" fill="#3fb950">✅ CONNECTED COMMON GROUND (PERFECT)</text>

    <!-- ESP32 Box -->
    <rect x="20" y="45" width="85" height="60" rx="6" fill="#21262d" stroke="#58a6ff"/>
    <text x="38" y="72" class="mono" fill="#58a6ff">ESP32</text>
    <text x="35" y="90" class="sub" font-size="10px">GND Pin</text>

    <!-- Sensor Box -->
    <rect x="270" y="45" width="85" height="60" rx="6" fill="#21262d" stroke="#3fb950"/>
    <text x="290" y="72" class="mono" fill="#3fb950">Sensor</text>
    <text x="285" y="90" class="sub" font-size="10px">GND Pin</text>

    <!-- Data wire working -->
    <line x1="105" y1="65" x2="270" y2="65" class="wire-data"/>
    <text x="150" y="58" class="mono" fill="#58a6ff" font-size="11px">SDA Data ✅</text>

    <!-- Common Ground Wire -->
    <line x1="105" y1="95" x2="270" y2="95" class="wire-gnd" stroke="#3fb950"/>
    <text x="135" y="115" class="mono" fill="#3fb950" font-size="10px">Shared GND Line</text>

    <rect x="15" y="130" width="345" height="50" rx="6" fill="#0d1117" stroke="#3fb950"/>
    <text x="25" y="150" class="mono" fill="#3fb950">Result: 100% Reliable Telemetry!</text>
    <text x="25" y="168" class="sub">Both chips share the exact same 0V baseline. Clean signals!</text>
  </g>
</svg>

